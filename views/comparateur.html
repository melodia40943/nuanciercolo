      </button>

    <div class="coll-modal-body" id="coll-modal-body">
      <div class="coll-modal-section-label" data-i18n="tools.coll.type">Type de feutre</div>

      <div class="coll-modal-coll-header" id="coll-coll-header"></div>

      <div class="coll-modal-section-label" data-i18n="tools.coll.add.label">Ajouter une marque</div>
      <div class="coll-modal-add-zone">
        <div class="coll-modal-select-wrap">

        <div class="coll-modal-select-wrap">
          <select id="coll-sel-pack" disabled>

          </select>

      <div class="coll-modal-footer-info" id="coll-footer-info"></div>
      <button class="coll-modal-apply-btn" id="coll-btn-apply" data-i18n="tools.coll.apply">Appliquer</button>
    </div>

  <!-- Picker overlay (multi-step: medium → brand → ref) -->
  <div class="cmp-picker hidden" id="cmp-picker" role="dialog" aria-modal="true" aria-label="Choisir un feutre de référence">
    <div class="cmp-picker-sheet">
      <div class="cmp-picker-head">
        <div class="cmp-picker-handle" aria-hidden="true"></div>
        <div class="picker-nav">
          <button class="picker-back-btn hidden" id="cmp-picker-back" aria-label="Étape précédente">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span data-i18n="cmp.picker.back">Retour</span>
          </button>
          <div class="cmp-picker-title" id="cmp-picker-title" data-i18n="cmp.picker.title">Quel médium ?</div>
        </div>
        <div class="cmp-picker-search-wrap hidden" id="cmp-picker-search-wrap">
          <span class="cmp-picker-search-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input class="cmp-picker-input" id="cmp-picker-input" type="search" placeholder="Numéro ou référence…" data-i18n-placeholder="cmp.picker.search" autocomplete="off">
        </div>
      </div>
      <div class="cmp-picker-list" id="cmp-picker-list"></div>
    </div>
  </div>

<script>
// ── Color distance (ΔE76 Lab approx) ──────────────────────────────────────────
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToLab(rgb){
  let[r,g,b]=rgb.map(v=>{v/=255;return v>0.04045?Math.pow((v+0.055)/1.055,2.4):v/12.92;});
  let x=(r*0.4124+g*0.3576+b*0.1805)/0.95047;
  let y=(r*0.2126+g*0.7152+b*0.0722)/1.0;
  let z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  return[116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))];
}
function dist(a,b){const A=rgbToLab(hx(a)),B=rgbToLab(hx(b));return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2);}
function qual(d){return d<6?'proche':d<13?'correct':'loin';}
function qualLabel(q){return{proche:t('match.great'),correct:t('match.good'),loin:t('match.ok')}[q]||q;}

// ── Mediums ───────────────────────────────────────────────────────────────────
function getMEDIUMS(){return[
  {id:'acrylique',label:t('mf.med.acrylique')||'Acrylique',      short:t('mf.med.acrylique')||'Acryl.',  color:'#FF6635'},
  {id:'gel',      label:t('mf.med.gel')||'Gel',                  short:t('mf.med.gel')||'Gel',           color:'#06D6A0'},
  {id:'crayon',   label:t('mf.med.crayon')||'Crayon',            short:t('mf.med.crayon')||'Crayon',     color:'#FFD500'},
  {id:'alcool',   label:t('mf.med.alcool')||'Marqueur alcool',   short:t('mf.med.alcool')||'Alcool',     color:'#4CC9F0'},
  {id:'eau',      label:t('mf.med.eau')||'Feutre à eau',         short:t('mf.med.eau')||'Eau',           color:'#7C9CFF'},
];}
function medById(id){return getMEDIUMS().find(m=>m.id===id)||{label:id,color:'#666'};}

// ── Collection ────────────────────────────────────────────────────────────────
const MF_KEY_COLL='revelo_collection_v2';
const MED_FULL={acrylique:'Feutre acrylique',gel:'Feutre gel',alcool:'Feutre à alcool',eau:'Feutre à eau',crayon:'Crayon de couleur'};
function loadColl(){return JSON.parse(localStorage.getItem(MF_KEY_COLL)||'{}');}
function colorInColl(c,coll){
  const label=MED_FULL[c.medium];
  const packs=label?(coll[label]||[]):[];
  if(!packs.length)return true;
  const owned=new Set(packs.map(s=>s.pack_id));
  if(!c.pack_ids||!c.pack_ids.length)return true;
  return c.pack_ids.some(pid=>owned.has(pid));
}
function renderCollBanner(coll){
  const el=document.getElementById('tools-coll-banner');
  if(!el)return;
  const entries=Object.entries(coll).filter(([,v])=>v&&v.length>0);
  if(!entries.length){
    el.innerHTML=`<svg class="tools-coll-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span class="tools-coll-txt">${t('cmp.coll.all')}</span><button class="tools-coll-lnk" onclick="openCollModal()">${t('cmp.coll.set')}</button>`;
    el.classList.add('tools-coll-banner--empty');
  }else{
    const parts=entries.map(([label,packs])=>{
      const mid=Object.entries(MED_FULL).find(([,v])=>v===label)?.[0];
      const n=packs.length;
      return `${n}&nbsp;pack${n>1?'s':''} <span class="tools-coll-med--${mid||''}">${label}</span>`;
    });
    el.innerHTML=`<svg class="tools-coll-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="tools-coll-txt">${parts.join(' · ')}</span><button class="tools-coll-lnk" onclick="openCollModal()">${t('cmp.coll.edit')}</button>`;
    el.classList.remove('tools-coll-banner--empty');
  }
}

// ── State ─────────────────────────────────────────────────────────────────────
let rawColors=[];
let colors=[];
let ref0=null;
let enabledMeds=new Set(['acrylique','gel','crayon','alcool','eau']);
let exact='correct';
let pickerQuery='';

// ── Compute ───────────────────────────────────────────────────────────────────
function computeMatches(){
  if(!ref0||!ref0.hex)return[];
  return colors
    .filter(c=>!(c.brand===ref0.brand&&c.ref===ref0.ref&&c.medium===ref0.medium))
    .filter(c=>enabledMeds.has(c.medium))
    .map(c=>{const d=dist(ref0.hex,c.hex);return{...c,d,q:qual(d)};})
    .filter(c=>exact==='tout'?true:exact==='correct'?c.q!=='loin':c.q==='proche')
    .sort((a,b)=>a.d-b.d);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderRefCard(){
  if(!ref0)return;
  const med=medById(ref0.medium);
  const sw=document.getElementById('cmp-ref-swatch');
  sw.style.background=ref0.hex;
  sw.style.width='58px';
  sw.style.height='58px';
  sw.className='t-swatch t-swatch--ring-'+ref0.medium;
  document.getElementById('cmp-ref-ref').textContent=ref0.ref;
  document.getElementById('cmp-ref-brand').textContent=ref0.brand;
  const medEl=document.getElementById('cmp-ref-med');
  medEl.style.color=med.color;
  medEl.style.background=med.color+'1f';
  document.getElementById('cmp-ref-med-dot').style.background=med.color;
  document.getElementById('cmp-ref-med-label').textContent=med.label;
  document.getElementById('cmp-ref-hex').textContent=ref0.hex.toUpperCase();
}

function renderChips(){
  const wrap=document.getElementById('cmp-med-chips');
  wrap.innerHTML='';
  getMEDIUMS().forEach(m=>{
    const on=enabledMeds.has(m.id);
    const btn=document.createElement('button');
    btn.className='t-chip'+(on?' t-chip--on t-chip--on-'+m.id:'');
    btn.setAttribute('aria-pressed',String(on));
    btn.innerHTML=`<span class="t-chip-dot dot--${m.id}"></span>${m.short}`;
    btn.addEventListener('click',()=>{
      if(enabledMeds.has(m.id))enabledMeds.delete(m.id);else enabledMeds.add(m.id);
      renderChips();
      renderResults();
    });
    wrap.appendChild(btn);
  });
}

function renderExact(){
  document.querySelectorAll('#cmp-exact-seg .t-seg-btn').forEach(btn=>{
    btn.classList.toggle('t-seg-btn--on',btn.dataset.exact===exact);
  });
}

function renderResults(){
  if(!ref0)return;
  document.getElementById('cmp-loading').style.display='none';
  document.getElementById('cmp-results').classList.remove('hidden');
  const matches=computeMatches();
  const nLabel=matches.length>1?t('cmp.n.markers'):t('cmp.n.marker');
  document.getElementById('cmp-count').textContent=matches.length+' '+nLabel;

  // Best match
  const bestEl=document.getElementById('cmp-best');
  if(matches.length>0){
    const b=matches[0];
    const med=medById(b.medium);
    bestEl.innerHTML=`
      <div class="cmp-best cmp-best--${b.q}">
        <div class="t-swatch t-swatch--ring-${b.medium}" style="width:50px;height:50px;background:${b.hex}"></div>
        <div class="cmp-best-body">
          <div class="cmp-best-label cmp-best-label--${b.q}">${t('cmp.best.label')}</div>
          <div class="cmp-best-ref">${escHtml(b.ref)} <span class="cmp-best-brand">· ${escHtml(b.brand)}</span></div>
          <div class="cmp-best-medium-row">
            <span class="cmp-best-medium-dot dot--${med.id}"></span>
            <span class="cmp-best-medium-txt">${med.label}</span>
          </div>
        </div>
        <span class="t-badge t-badge--${b.q}">${qualLabel(b.q)}</span>
      </div>`;
  } else {
    bestEl.innerHTML='';
  }

  // Groups by medium
  const groupsEl=document.getElementById('cmp-groups');
  groupsEl.innerHTML='';
  if(matches.length===0){
    groupsEl.innerHTML=`<div class="cmp-empty">${t('cmp.empty').replace('\n','<br>')}</div>`;
    return;
  }
  getMEDIUMS().filter(m=>enabledMeds.has(m.id)).forEach(m=>{
    const items=matches.filter(c=>c.medium===m.id);
    if(!items.length)return;
    const g=document.createElement('div');
    g.className='cmp-group';
    g.innerHTML=`
      <div class="cmp-group-header">
        <span class="cmp-group-dot dot--${m.id}"></span>
        <span class="cmp-group-name">${m.label}</span>
        <span class="cmp-group-count cmp-group-count--${m.id}">${items.length}</span>
      </div>
      <div class="cmp-group-cards">${items.map(cardHtml).join('')}</div>`;
    groupsEl.appendChild(g);
  });
}

function cardHtml(c){
  const layersHtml=c.couches?`<span class="cmp-card-layers"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/></svg>${t('couches.'+c.couches)}</span>`:'';
  const refAltHtml=c.refAlt?`<span class="cmp-card-refalt"> · ex. ${escHtml(c.refAlt)}</span>`:'';
  return `<div class="cmp-card">
    <div class="t-swatch" style="width:42px;height:42px;background:${c.hex}"></div>
    <div class="cmp-card-info">
      <div class="cmp-card-top">
        <span class="cmp-card-ref">${escHtml(c.ref)}</span>
        ${layersHtml}
      </div>
      <div class="cmp-card-brand">${escHtml(c.brand)}${refAltHtml}</div>
    </div>
    <span class="t-badge t-badge--${c.q}">${qualLabel(c.q)}</span>
  </div>`;
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Multi-step Picker ─────────────────────────────────────────────────────────
let pickerStep=0; // 0=medium 1=brand 2=ref
let pickerMedium=null;
let pickerBrand=null;

function openPicker(){
  pickerStep=0; pickerMedium=null; pickerBrand=null; pickerQuery='';
  document.getElementById('cmp-picker').classList.remove('hidden');
  renderPicker();
}
function closePicker(){
  document.getElementById('cmp-picker').classList.add('hidden');
}
function renderPicker(){
  const titleEl=document.getElementById('cmp-picker-title');
  const backBtn=document.getElementById('cmp-picker-back');
  const searchWrap=document.getElementById('cmp-picker-search-wrap');
  const listEl=document.getElementById('cmp-picker-list');
  backBtn.classList.toggle('hidden',pickerStep===0);
  searchWrap.classList.toggle('hidden',pickerStep!==2);

  if(pickerStep===0){
    // Step 0: choose medium
    titleEl.textContent=t('cmp.picker.title');
    const presentIds=new Set(rawColors.map(c=>c.medium));
    const meds=getMEDIUMS().filter(m=>presentIds.has(m.id));
    listEl.innerHTML=meds.map(m=>{
      const n=rawColors.filter(c=>c.medium===m.id).length;
      const nLabel=n>1?t('cmp.n.colors'):t('cmp.n.color');
      return `<button class="picker-med-btn" data-med="${m.id}">
        <span class="picker-med-icon">
          <span class="picker-med-dot"></span>
        </span>
        <span class="picker-flex-body">
          <span class="picker-med-name">${m.label}</span>
          <span class="picker-med-count">${n} ${nLabel}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="picker-chevron" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>`;
    }).join('');
    listEl.querySelectorAll('.picker-med-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{pickerMedium=btn.dataset.med;pickerStep=1;renderPicker();});
    });

  }else if(pickerStep===1){
    // Step 1: choose brand
    const med=medById(pickerMedium);
    titleEl.textContent=med.label;
    const brands=[...new Set(rawColors.filter(c=>c.medium===pickerMedium).map(c=>c.brand))].sort();
    listEl.innerHTML=brands.map(b=>{
      const n=rawColors.filter(c=>c.medium===pickerMedium&&c.brand===b).length;
      const nLabel=n>1?t('cmp.n.colors'):t('cmp.n.color');
      return `<button class="picker-brand-btn" data-brand="${escHtml(b)}">
        <span class="picker-flex-body">
          <span class="picker-brand-name">${escHtml(b)}</span>
          <span class="picker-brand-count">${n} ${nLabel}</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="picker-chevron" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>`;
    }).join('');
    listEl.querySelectorAll('.picker-brand-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        pickerBrand=btn.dataset.brand;pickerStep=2;pickerQuery='';
        document.getElementById('cmp-picker-input').value='';
        renderPicker();
        setTimeout(()=>document.getElementById('cmp-picker-input').focus(),80);
      });
    });

  }else if(pickerStep===2){
    // Step 2: choose reference
    titleEl.textContent=escHtml(pickerBrand);
    const q=pickerQuery.toLowerCase();
    const list=rawColors.filter(c=>c.medium===pickerMedium&&c.brand===pickerBrand&&c.ref.toLowerCase().includes(q));
    listEl.innerHTML=list.length?list.map(c=>`<button class="cmp-picker-item" data-ref="${escHtml(c.ref)}" data-brand="${escHtml(c.brand)}" data-medium="${escHtml(c.medium)}">
      <div class="t-swatch" style="width:36px;height:36px;background:${c.hex}"></div>
      <div class="cmp-picker-item-info">
        <div class="cmp-picker-item-ref">${escHtml(c.ref)}</div>
        ${c.refAlt?`<div class="cmp-ref-alt">ex. ${escHtml(c.refAlt)}</div>`:''}
      </div>
    </button>`).join(''):`<div class="cmp-picker-none">${t('cmp.picker.none')}</div>`;
    listEl.querySelectorAll('.cmp-picker-item').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const found=rawColors.find(c=>c.ref===btn.dataset.ref&&c.brand===btn.dataset.brand&&c.medium===btn.dataset.medium);
        if(found){ref0=found;renderRefCard();renderResults();}
        closePicker();
      });
    });
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('cmp-open-picker').addEventListener('click',openPicker);
document.getElementById('cmp-picker').addEventListener('click',e=>{if(e.target===document.getElementById('cmp-picker'))closePicker();});
document.getElementById('cmp-picker-back').addEventListener('click',()=>{
  if(pickerStep===1){pickerStep=0;pickerMedium=null;}
  else if(pickerStep===2){pickerStep=1;pickerBrand=null;pickerQuery='';}
  renderPicker();
});
document.getElementById('cmp-picker-input').addEventListener('input',e=>{pickerQuery=e.target.value;renderPicker();});
document.querySelectorAll('#cmp-exact-seg .t-seg-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{exact=btn.dataset.exact;renderExact();renderResults();});
});

async function init(){
  try{
    const resp=await fetch('/api/comparateur/couleurs');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    rawColors=await resp.json();
    const coll=loadColl();
    colors=rawColors.filter(c=>colorInColl(c,coll));
    renderCollBanner(coll);
    if(rawColors.length){
      ref0=rawColors.find(c=>c.brand==='Guangna'&&c.ref==='620')||rawColors[0];
    }
    renderChips();
    renderExact();
    renderRefCard();
    renderResults();
  }catch(e){
    document.getElementById('cmp-loading').textContent=t('cmp.load.fail');
    console.error(e);
  }
}
init();

window.addEventListener('storage',e=>{
  if(e.key!==MF_KEY_COLL)return;
  const coll=loadColl();
  colors=rawColors.filter(c=>colorInColl(c,coll));
  renderCollBanner(coll);
  renderResults();
});

// ── Collection modal ──────────────────────────────────────────────────────────
const MF_MED_KEY='revelo_active_medium';
const MEDIUM_META_COLL={
  'Feutre acrylique':{id:'acrylique',color:'#FF6635'},
  'Feutre gel':      {id:'gel',      color:'#06D6A0'},
  'Feutre à alcool': {id:'alcool',   color:'#4CC9F0'},
  'Feutre à eau':    {id:'eau',      color:'#7C9CFF'},
  'Crayon de couleur':{id:'crayon',  color:'#FFD500'},
};
let collActiveMedium=localStorage.getItem(MF_MED_KEY)||null;
let collDraft=[];
let collMarques=[];
let collActiveMediums=[];

function collGetColor(name){return MEDIUM_META_COLL[name]?.color||'#4A6CF7';}

function collSave(){
  const coll=loadColl();
  if(collActiveMedium)coll[collActiveMedium]=[...collDraft];
  localStorage.setItem(MF_KEY_COLL,JSON.stringify(coll));
}

function collRenderMedGrid(){
  const grid=document.getElementById('coll-med-grid');
  const coll=loadColl();
  grid.innerHTML=collActiveMediums.map(name=>{
    const color=collGetColor(name);
    const count=(coll[name]||[]).length;
    const sel=name===collActiveMedium;
    return `<button class="coll-med-btn${sel?' coll-med-btn--on':''}" data-medium="${name}" style="--mc:${color}">
      <span class="coll-med-label">${name}</span>
      <span class="coll-med-count" style="${count?'color:'+color:''}">${count?count+' pack'+(count>1?'s':''):t('cmp.med.none')}</span>
    </button>`;
  }).join('');
  grid.querySelectorAll('.coll-med-btn').forEach(btn=>{
    btn.addEventListener('click',()=>collSwitchMedium(btn.dataset.medium));
  });
}

function collRenderHeader(){
  const el=document.getElementById('coll-coll-header');
  if(!collActiveMedium){el.innerHTML='';return;}
  const color=collGetColor(collActiveMedium);
  el.innerHTML=`<span class="coll-modal-section-label" style="margin-bottom:0">Collection</span>
    <span class="coll-dot" style="background:${color}"></span>
    <span style="color:${color};font-size:14px;font-weight:600">${collActiveMedium}</span>`;
}

function collRenderDraft(){
  const list=document.getElementById('coll-coll-list');
  if(!collDraft.length){
    if(collActiveMedium){
      list.innerHTML=`<div class="coll-empty">${t('tools.coll.none.packs')} <strong style="color:#ECECF4">${collActiveMedium}</strong></div>`;
    }else{list.innerHTML='';}
    return;
  }
  list.innerHTML=collDraft.map((s,i)=>`
    <div class="coll-entry">
      <div class="coll-entry-info">
        <div class="coll-entry-marque">${s.marque_nom}</div>
        <div class="coll-entry-pack">${s.pack_nom}</div>
      </div>
      <button class="coll-entry-del" data-i="${i}" aria-label="Supprimer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>`).join('');
  list.querySelectorAll('.coll-entry-del').forEach(btn=>{
    btn.addEventListener('click',e=>{
      collDraft.splice(Number(e.currentTarget.dataset.i),1);
      collSave();collRenderDraft();collRenderFooter();
    });
  });
}

function collRenderFooter(){
  const el=document.getElementById('coll-footer-info');
  if(!collActiveMedium){el.innerHTML='';return;}
  const color=collGetColor(collActiveMedium);
  const count=collDraft.length;
  el.innerHTML=`<strong style="color:${color}">${collActiveMedium}</strong> · ${count} ${count!==1?t('tools.coll.n.packs'):t('tools.coll.n.pack')}`;
}

async function collLoadMarques(){
  if(!collActiveMedium)return;
  const marqEl=document.getElementById('coll-sel-marque');
  const packEl=document.getElementById('coll-sel-pack');
  marqEl.innerHTML=`<option value="">${t('tools.coll.add.marque')}</option>`;
  packEl.innerHTML=`<option value="">${t('tools.coll.add.pack')}</option>`;
  packEl.disabled=true;
  document.getElementById('coll-btn-add').disabled=true;
  try{
    const data=await fetch(`/api/marques-packs?medium=${encodeURIComponent(collActiveMedium)}`).then(r=>r.json());
    collMarques=data;
    data.forEach(m=>{
      const opt=document.createElement('option');
      opt.value=m.id;opt.textContent=m.nom;
      marqEl.appendChild(opt);
    });
  }catch(e){}
}

function collSwitchMedium(name){
  collActiveMedium=name;
  const coll=loadColl();
  collDraft=coll[name]?JSON.parse(JSON.stringify(coll[name])):[];
  collRenderMedGrid();collRenderHeader();collRenderDraft();collRenderFooter();collLoadMarques();
}

function openCollModal(){
  const coll=loadColl();
  if(collActiveMedium)collDraft=coll[collActiveMedium]?JSON.parse(JSON.stringify(coll[collActiveMedium])):[];
  collRenderMedGrid();collRenderHeader();collRenderDraft();collRenderFooter();collLoadMarques();
  document.getElementById('coll-modal').classList.remove('hidden');
  document.getElementById('coll-modal-overlay').classList.remove('hidden');
}

function closeCollModal(){
  document.getElementById('coll-modal').classList.add('hidden');
  document.getElementById('coll-modal-overlay').classList.add('hidden');
  const coll=loadColl();
  colors=rawColors.filter(c=>colorInColl(c,coll));
  renderCollBanner(coll);
  renderResults();
}

document.getElementById('btn-coll').addEventListener('click',openCollModal);
document.getElementById('coll-modal-close').addEventListener('click',closeCollModal);
document.getElementById('coll-modal-overlay').addEventListener('click',closeCollModal);
document.getElementById('coll-btn-apply').addEventListener('click',()=>{
  localStorage.setItem(MF_MED_KEY,collActiveMedium||'');
  closeCollModal();
});
document.getElementById('coll-sel-marque').addEventListener('change',function(){
  const packEl=document.getElementById('coll-sel-pack');
  packEl.innerHTML=`<option value="">${t('tools.coll.add.pack')}</option>`;
  packEl.disabled=true;
  document.getElementById('coll-btn-add').disabled=true;
  const marque=collMarques.find(m=>m.id===Number(this.value));
  if(!marque||!marque.packs.length)return;
  marque.packs.forEach(p=>{
    const opt=document.createElement('option');
    opt.value=p.id;opt.textContent=p.nom;
    opt.dataset.nb=p.nb_couleurs;opt.dataset.nom=p.nom;
    packEl.appendChild(opt);
  });
  packEl.disabled=false;
});
document.getElementById('coll-sel-pack').addEventListener('change',function(){
  document.getElementById('coll-btn-add').disabled=!this.value;
});
document.getElementById('coll-btn-add').addEventListener('click',()=>{
  const marqEl=document.getElementById('coll-sel-marque');
  const packEl=document.getElementById('coll-sel-pack');
  const selOpt=packEl.options[packEl.selectedIndex];
  if(!marqEl.value||!packEl.value)return;
  const marque=collMarques.find(m=>m.id===Number(marqEl.value));
  const packId=Number(packEl.value);
  if(collDraft.some(s=>s.pack_id===packId))return;
  collDraft.push({marque_id:marque.id,marque_nom:marque.nom,pack_id:packId,pack_nom:selOpt.dataset.nom,pack_nb:Number(selOpt.dataset.nb)});
  collSave();
  marqEl.value='';
  packEl.innerHTML=`<option value="">${t('tools.coll.add.pack')}</option>`;
  packEl.disabled=true;
  document.getElementById('coll-btn-add').disabled=true;
  collRenderDraft();collRenderFooter();collRenderMedGrid();
});

fetch('/api/mediums/active').then(r=>r.json()).then(mediums=>{
  collActiveMediums=mediums;
  if(!collActiveMedium&&mediums.length){
    collActiveMedium=mediums[0];
    localStorage.setItem(MF_MED_KEY,collActiveMedium);
  }
}).catch(()=>{});
</script>
